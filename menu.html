<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>المنيو · جمرة</title>
  <meta name="description" content="منيو جمرة الكامل: برجر على الفحم، باستا، بيتزا حطب، مشويات، حلويات ومشروبات.">
  <meta name="theme-color" content="#1a0709">
  <script>document.documentElement.classList.add('page-enter')</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;600;700&family=Readex+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body data-page="menu">

<header class="page-hero" style="--bg:url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=1800&q=80&auto=format&fit=crop')">
  <canvas class="embers" aria-hidden="true"></canvas>
  <div class="container page-hero-inner">
    <nav class="crumbs" aria-label="مسار الصفحة"><a href="index.html">الرئيسية</a><span aria-hidden="true">/</span><span aria-current="page">المنيو</span></nav>
    <h1 class="reveal">كل اللي <em>بيطلع من النار</em></h1>
    <p class="reveal" style="--d:.1s">٢٢ صنف في ٦ أقسام. فلتر بالقسم، دوّر باسم الأكلة، أو رتّب بالسعر.</p>
  </div>
  <svg class="divider-wave" viewBox="0 0 1440 120" preserveAspectRatio="none" aria-hidden="true"><path d="M0 64c120 32 260 52 420 30S700 10 880 20s300 70 420 66c60-2 110-14 140-22v56H0z" fill="var(--coal)"/></svg>
</header>

<main id="main" class="page-main">
  <div class="container menu-page">
    <!-- sidebar: search + categories + filters -->
    <aside class="menu-side glass" aria-label="تصفح المنيو">
      <label class="search">
        <svg><use href="#i-search"/></svg>
        <input id="search" type="search" placeholder="دوّر على أكلة…" aria-label="بحث في المنيو">
      </label>

      <span class="side-title">الأقسام</span>
      <nav class="side-cats" id="catChips" role="tablist" aria-label="الأقسام"></nav>

      <span class="side-title">فلتر</span>
      <div class="toggles" role="group" aria-label="فلاتر">
        <button class="toggle" data-flag="spicy" aria-pressed="false">🌶 حار</button>
        <button class="toggle" data-flag="veg" aria-pressed="false">🌱 نباتي</button>
        <button class="toggle" data-flag="isNew" aria-pressed="false">✨ جديد</button>
      </div>
      <label class="select-wrap">
        <span class="sr-only">ترتيب</span>
        <select id="sort" aria-label="ترتيب">
          <option value="">الترتيب: المقترح</option>
          <option value="pop">الأكثر طلباً</option>
          <option value="asc">السعر: من الأقل</option>
          <option value="desc">السعر: من الأعلى</option>
        </select>
      </label>
    </aside>

    <!-- content: one category at a time -->
    <section class="menu-content" aria-live="polite">
      <div id="menuResults"></div>
    </section>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/menu.js"></script>
</body>
</html>
